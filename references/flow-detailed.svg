<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1330" width="680" height="1330" role="img"><title>达芬奇21中文操作手册 · 完整调用流程（首次判定 + 双触发源三态递进 + 回归测试）</title><desc>完整流程：阶段零首次使用判定（读状态文件，跨会话只做一次）；阶段一三词典问句归一化；阶段二 L1 极速两轮本地检索；阶段三升级判定双触发源（本地答不上来 / 用户明确要深入）；阶段四 L2 深读联网双重比对；阶段五 L3 兜底明说未覆盖；阶段六答后必问与回写词典；附检索路由表与命中率现状。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/></marker></defs><rect x="0" y="0" width="680" height="1330" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="340" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">完整调用流程 · 首次判定 + 三态递进</text><text x="340" y="41" font-size="10" text-anchor="middle" fill="#656d76">v2.10 · 六阶段 · 命中率 术语 100% / 白话 100%</text><rect x="20" y="54" width="640" height="96" rx="10" fill="#f6f8fa" stroke="#c9d1d9" stroke-width="1.5"/><text x="32" y="70" font-size="11" font-weight="700" fill="#1f2328">阶段 0 · 首次使用判定（同一用户跨会话只做一次）</text><rect x="36" y="78" width="296" height="40" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/><text x="47" y="96" font-size="11" font-weight="600" fill="#1f2328">读状态文件</text><text x="47" y="111" font-size="9.5" fill="#656d76">node scripts/check-first-run.js（只读探测）</text><rect x="348" y="78" width="296" height="40" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="359" y="96" font-size="11" font-weight="600" fill="#1f2328">isFirstRun = false</text><text x="359" y="111" font-size="9.5" fill="#656d76">→ 跳过引导，直接问答（不弹图不读SVG）</text><line x1="336" y1="98" x2="346" y2="98" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ar)"/><text x="184" y="130" font-size="9.2" fill="#bf8700">true → 首次：Read flow-overview.svg → show_widget → --mark 落盘</text><text x="184" y="143" font-size="8.6" fill="#656d76">状态文件：~/.workbuddy/skills/.state/*.json（在 git 仓库外，skill 更新/重装不丢）</text><rect x="130" y="160" width="420" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="141" y="178" font-size="12" font-weight="600" fill="#1f2328">阶段 1 · 问句归一化（必做，检索前）</text><text x="141" y="193" font-size="9.5" fill="#656d76">① 小白现象词典（106 条） ② 口语问句映射（197 条） ③ 中英术语（112）/ 实战路由（75）</text><text x="141" y="206" font-size="9.5" fill="#656d76">匹配：整句精确 → 滑窗 2~12 字 → 取值按 / → 空格拆多候选词</text><line x1="340" y1="212" x2="340" y2="228" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#ar)"/><text x="348" y="225" font-size="9.2" fill="#cf222e">命中「需澄清」→ 先反问用户，不硬答不联网</text><rect x="20" y="228" width="640" height="158" rx="10" fill="none" stroke="#0969da" stroke-width="2"/><rect x="20" y="228" width="76" height="21" rx="6" fill="#0969da" stroke="#0969da" stroke-width="1"/><text x="58.0" y="243" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff">L1 极速</text><text x="107" y="243" font-size="9.5" fill="#0969da">默认 · 全程离线 · 禁止联网 · ≤300 字</text><rect x="40" y="258" width="292" height="46" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/><text x="51" y="276" font-size="11.5" font-weight="600" fill="#1f2328">第 1 轮 · 小资产 Grep（~250ms）</text><text x="51" y="291" font-size="9.8" fill="#656d76">高频速查 128 / 快捷键 818 / 插件对照</text><text x="51" y="304" font-size="9.8" fill="#656d76">插件清单 169 / 术语对照</text><rect x="348" y="258" width="292" height="46" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/><text x="359" y="276" font-size="11.5" font-weight="600" fill="#1f2328">第 2 轮 · 倒排索引拿页码（~300ms）</text><text x="359" y="291" font-size="9.8" fill="#656d76">index_terms.txt 36711 词（每词一行）</text><text x="359" y="304" font-size="9.8" fill="#656d76">→ 按页码精读 21.1原文检索.txt 局部</text><rect x="40" y="314" width="292" height="30" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="51" y="332" font-size="10.5" font-weight="600" fill="#1f2328">开发类直通（不走前两轮）</text><text x="51" y="347" font-size="9.5" fill="#656d76">Grep 官方开发文档蒸馏.md</text><rect x="348" y="314" width="292" height="30" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="359" y="332" font-size="10.5" font-weight="600" fill="#1f2328">⚠ 禁用 index.json（71万字符单行）</text><text x="359" y="347" font-size="9.5" fill="#656d76">用 index_terms.txt 替代</text><rect x="40" y="354" width="600" height="24" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="51" y="372" font-size="10.5" font-weight="600" fill="#1f2328">✓ 能给出完整步骤 → 直接答（结论 + 1/2/3 步骤 + 快捷键 Mac/Win + 仅Studio 标注）</text><line x1="340" y1="386" x2="340" y2="404" stroke="#8250df" stroke-width="1.5" marker-end="url(#ar)"/><rect x="20" y="404" width="640" height="92" rx="10" fill="none" stroke="#8250df" stroke-width="2"/><rect x="20" y="404" width="92" height="21" rx="6" fill="#8250df" stroke="#8250df" stroke-width="1"/><text x="66.0" y="419" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff">升级判定</text><text x="123" y="419" font-size="9.5" fill="#8250df">双触发源 · 命中任一即升 L2 · 与「是不是追问」无关</text><rect x="40" y="434" width="292" height="50" rx="8" fill="#f3e8ff" stroke="#8250df" stroke-width="1"/><text x="51" y="452" font-size="11" font-weight="600" fill="#1f2328">A · 本地答不上来</text><text x="51" y="467" font-size="9.5" fill="#656d76">① 两轮都没命中</text><text x="51" y="480" font-size="9.5" fill="#656d76">② 只能给参数、给不出原理</text><rect x="348" y="434" width="292" height="50" rx="8" fill="#f3e8ff" stroke="#8250df" stroke-width="1"/><text x="359" y="452" font-size="11" font-weight="600" fill="#1f2328">B · 用户明确要深入</text><text x="359" y="467" font-size="9.5" fill="#656d76">深入类：详细讲讲/为什么/原理</text><text x="359" y="480" font-size="9.5" fill="#656d76">对比类：对比一下/哪个好　穷尽类：都有哪些</text><text x="340" y="492" font-size="9" text-anchor="middle" fill="#656d76">「追问」是辅助信号，只用于答后多给背景 + 篇幅放宽到 400~500 字，本身不触发升级</text><line x1="340" y1="496" x2="340" y2="514" stroke="#bf8700" stroke-width="1.5" marker-end="url(#ar)"/><rect x="20" y="514" width="640" height="106" rx="10" fill="none" stroke="#bf8700" stroke-width="2"/><rect x="20" y="514" width="76" height="21" rx="6" fill="#bf8700" stroke="#bf8700" stroke-width="1"/><text x="58.0" y="529" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff">L2 深读</text><text x="107" y="529" font-size="9.5" fill="#bf8700">自动升级 · 首次联网 · 篇幅放宽</text><rect x="40" y="544" width="600" height="44" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1"/><text x="51" y="562" font-size="11.5" font-weight="600" fill="#1f2328">全文精读 ±50~100 行（中/英对照）</text><text x="51" y="577" font-size="9.8" fill="#656d76">用 index_terms.txt 定位页码 + chapters.txt 定章节 → 读命中处上下文</text><rect x="40" y="594" width="600" height="20" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1"/><text x="51" y="612" font-size="9.8" font-weight="600" fill="#1f2328">+ 联网搜索（官方社区 / YouTube / B站）做双重比对，冲突以英文原版 + 官方来源为准</text><line x1="340" y1="620" x2="340" y2="638" stroke="#cf222e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="20" y="638" width="640" height="84" rx="10" fill="none" stroke="#cf222e" stroke-width="2"/><rect x="20" y="638" width="76" height="21" rx="6" fill="#cf222e" stroke="#cf222e" stroke-width="1"/><text x="58.0" y="653" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff">L3 兜底</text><text x="107" y="653" font-size="9.5" fill="#cf222e">手册未覆盖 · 不编造</text><rect x="40" y="668" width="600" height="44" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="51" y="686" font-size="11.5" font-weight="600" fill="#1f2328">明说「手册未覆盖」+ 标注「这是外部说法、非手册内容」</text><text x="51" y="701" font-size="9.8" fill="#656d76">给外部来源链接 + 可执行的排查 / 试错步骤（而不是含糊结论）</text><line x1="340" y1="722" x2="340" y2="740" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ar)"/><rect x="20" y="740" width="640" height="106" rx="10" fill="none" stroke="#1a7f37" stroke-width="2"/><rect x="20" y="740" width="88" height="21" rx="6" fill="#1a7f37" stroke="#1a7f37" stroke-width="1"/><text x="64.0" y="755" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff">输出与回写</text><text x="119" y="755" font-size="9.5" fill="#1a7f37">每次回答都要做</text><rect x="40" y="770" width="292" height="62" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="51" y="788" font-size="11.5" font-weight="600" fill="#1f2328">答后必问</text><text x="51" y="803" font-size="9.8" fill="#656d76">末行问「要打开手册浏览器？」</text><text x="51" y="816" font-size="9.8" fill="#656d76">用户确认后才present_files 打开</text><text x="51" y="829" font-size="9.8" fill="#656d76">（六个 tab，默认不开）</text><rect x="348" y="770" width="292" height="62" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="359" y="788" font-size="11.5" font-weight="600" fill="#1f2328">回写本地资产</text><text x="359" y="803" font-size="9.8" fill="#656d76">新问法补进三层词典</text><text x="359" y="816" font-size="9.8" fill="#656d76">node check-first-run.js --topic "域-对象"</text><text x="359" y="829" font-size="9.8" fill="#656d76">→ 下次同问题在 L1 命中</text><line x1="340" y1="846" x2="340" y2="864" stroke="#8250df" stroke-width="1.5" marker-end="url(#ar)"/><rect x="20" y="864" width="640" height="92" rx="10" fill="none" stroke="#8250df" stroke-width="2"/><rect x="20" y="864" width="108" height="21" rx="6" fill="#8250df" stroke="#8250df" stroke-width="1"/><text x="74.0" y="879" font-size="10.5" font-weight="700" text-anchor="middle" fill="#fff">维护闭环</text><text x="139" y="879" font-size="9.5" fill="#8250df">词典改动后必跑回归</text><rect x="40" y="894" width="600" height="52" rx="8" fill="#f3e8ff" stroke="#8250df" stroke-width="1"/><text x="51" y="912" font-size="11.5" font-weight="600" fill="#1f2328">node scripts/hitrate-test.js</text><text x="51" y="927" font-size="9.8" fill="#656d76">内置 75 条真实问句（A 档术语 37 + B 档白话 38），<95% 报警</text><text x="51" y="940" font-size="9.8" fill="#656d76">另读recentTopics 做真实问句覆盖检查，未命中即提示补词典</text><text x="20" y="984" font-size="11.5" font-weight="700" fill="#1f2328">检索路由（按问题类型）</text><text x="24" y="1002" font-size="9.8" fill="#0969da">▸ 快捷键</text><text x="280" y="1002" font-size="9.8" fill="#656d76">shortcuts.md（818 条 / 14 模块）</text><text x="660" y="1002" font-size="9.2" text-anchor="end" fill="#1a7f37">~250ms</text><text x="24" y="1018" font-size="9.8" fill="#0969da">▸ 怎么XXX / 某功能在哪</text><text x="280" y="1018" font-size="9.8" fill="#656d76">高频速查.md 128 条 → 未中则 index_terms.txt 拿页码</text><text x="660" y="1018" font-size="9.2" text-anchor="end" fill="#1a7f37">~300ms</text><text x="24" y="1034" font-size="9.8" fill="#0969da">▸ 插件中文名 / 是否 Studio</text><text x="280" y="1034" font-size="9.8" fill="#656d76">Resolve_FX中英对照.md + Fairlight音频插件.md</text><text x="660" y="1034" font-size="9.2" text-anchor="end" fill="#1a7f37">~250ms</text><text x="24" y="1050" font-size="9.8" fill="#0969da">▸ 实战技巧（色彩/混音/Fusion/转软件）</text><text x="280" y="1050" font-size="9.8" fill="#656d76">实战术语对照.txt → 油管笔记对应小节</text><text x="660" y="1050" font-size="9.2" text-anchor="end" fill="#1a7f37">~300ms</text><text x="24" y="1066" font-size="9.8" fill="#0969da">▸ 有没有免费插件 / 怎么装</text><text x="280" y="1066" font-size="9.8" fill="#656d76">开源插件清单.md（169 项 + 四类安装路径）</text><text x="660" y="1066" font-size="9.2" text-anchor="end" fill="#1a7f37">~250ms</text><text x="24" y="1082" font-size="9.8" fill="#0969da">▸ 开发 / 脚本 / API / MCP / DCTL</text><text x="280" y="1082" font-size="9.8" fill="#656d76">官方开发文档蒸馏.md（直达，不联网）</text><text x="660" y="1082" font-size="9.2" text-anchor="end" fill="#1a7f37">~300ms</text><text x="24" y="1098" font-size="9.8" fill="#0969da">▸ 都没命中</text><text x="280" y="1098" font-size="9.8" fill="#656d76">index_terms.txt 拿页码 → 全文精读局部（可切中·英）</text><text x="660" y="1098" font-size="9.2" text-anchor="end" fill="#1a7f37">~300ms</text><rect x="20" y="1128" width="640" height="72" rx="10" fill="#f6f8fa" stroke="#c9d1d9" stroke-width="1.5"/><text x="32" y="1146" font-size="11" font-weight="700" fill="#1f2328">为什么 L1 坚决不联网</text><text x="32" y="1163" font-size="9.5" fill="#656d76">本地 Grep 约 250~310ms、返回 KB 级；联网 3~15 秒、返回几十 KB 且可能不通（本机 git push / PyPI 均被代理拦）。</text><text x="32" y="1179" font-size="9.5" fill="#656d76">联网是「查不到时的兜底」，不是加速手段 —— 绝大多数问题本地已覆盖。命中率：术语 100% / 白话 100%。</text><text x="20" y="1224" font-size="10.5" font-weight="700" fill="#1f2328">归一化词典规模（2026-10-05）</text><text x="20" y="1242" font-size="9.8" fill="#656d76">小白现象 106 条　·　口语问句 197 条　·　中英术语 112 条　·　实战路由 75 条</text><text x="20" y="1262" font-size="9.2" fill="#656d76">状态文件 ~/.workbuddy/skills/.state/达芬奇21中文操作手册.json（firstRunShown / recentTopics / useCount）</text><text x="20" y="1284" font-size="9.2" fill="#656d76">详细说明见使用思路.md　·　流程图源文件 references/flow-detailed.svg</text></svg>