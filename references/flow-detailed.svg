<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1252" width="680" height="1252" role="img"><title>达芬奇21中文操作手册 三态递进调用流程（L1 极速 → L2 深读 → L3 兜底）</title><desc>三态递进：默认 L1 极速走本地离线检索（≤2 轮 Grep）；本地未命中、用户要深度、或追问≥2 轮时自动升级 L2 深读（全文精读 + 联网双重比对）；L2 仍不确定则进 L3 兜底，明说手册未覆盖并标注外部说法。只有 L2/L3 联网。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/></marker></defs><rect width="680" height="1252" fill="#ffffff"/><text x="340" y="28" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">达芬奇 21 中文操作手册 · 三态递进调用流程</text><text x="340" y="47" font-size="11" text-anchor="middle" fill="#656d76">L1 极速（默认·离线） → L2 深读（联网比对） → L3 兜底（明说未覆盖）</text><rect x="200" y="62" width="280" height="38" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="212" y="82" font-size="13" font-weight="600" fill="#1f2328">用户提达芬奇问题</text><line x1="340" y1="100" x2="340" y2="122" stroke="#d0d7de" stroke-width="1.6" marker-end="url(#ar)"/><rect x="150" y="122" width="380" height="58" rx="8" fill="#ddf4ff" stroke="#0969da"/><text x="162" y="142" font-size="13" font-weight="600" fill="#1f2328">第 0 步 · 问句归一化（必做）</text><text x="162" y="159" font-size="11" fill="#656d76">三层词典：① 小白现象词典 ② 口语问句映射 ③ 中英/章节映射</text><text x="162" y="174" font-size="11" fill="#656d76">整句精确 → 滑窗 2~12 字 → 拆多候选词</text><line x1="340" y1="180" x2="340" y2="202" stroke="#d0d7de" stroke-width="1.6" marker-end="url(#ar)"/><text x="352" y="196" font-size="10.5" fill="#cf222e">「需澄清」→ 先反问，不联网</text><rect x="20" y="202" width="640" height="336" rx="10" fill="none" stroke="#0969da" stroke-width="2"/><rect x="20" y="202" width="86" height="24" rx="6" fill="#0969da"/><text x="63" y="219" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">L1 极速</text><text x="116" y="219" font-size="10.5" fill="#0969da">默认 · 全程离线 · ≤300字 · 禁止联网</text><rect x="46" y="240" width="588" height="40" rx="8" fill="#ffffff" stroke="#c9d1d9"/><text x="58" y="260" font-size="13" font-weight="600" fill="#1f2328">第 1 轮 Grep · 小资产（命中即答，最快 ~250ms）</text><text x="58" y="277" font-size="11" fill="#656d76">高频速查128条 / shortcuts.md 818条 / 插件中英对照 / 术语对照 / 开源插件清单</text><line x1="340" y1="280" x2="340" y2="302" stroke="#d0d7de" stroke-width="1.6" marker-end="url(#ar)"/><text x="340" y="287" font-size="10.5" fill="#656d76" text-anchor="middle">未命中</text><rect x="46" y="302" width="588" height="40" rx="8" fill="#ffffff" stroke="#c9d1d9"/><text x="58" y="322" font-size="13" font-weight="600" fill="#1f2328">第 2 轮 Grep · 倒排索引定位页码</text><text x="58" y="339" font-size="11" fill="#656d76">index_terms.txt（36711 词，每词一行）→ 按页码精读 21.1原文检索.txt 局部</text><line x1="340" y1="342" x2="340" y2="364" stroke="#d0d7de" stroke-width="1.6" marker-end="url(#ar)"/><text x="340" y="349" font-size="10.5" fill="#656d76" text-anchor="middle">仍未命中</text><rect x="46" y="364" width="280" height="44" rx="8" fill="#dafbe1" stroke="#1a7f37"/><text x="58" y="384" font-size="13" font-weight="600" fill="#1f2328">✓ 命中 → 组答案</text><text x="58" y="401" font-size="11" fill="#656d76">结论 + 1/2/3 步骤 + 快捷键(Mac/Win)</text><rect x="354" y="364" width="280" height="44" rx="8" fill="#ffebe9" stroke="#cf222e"/><text x="366" y="384" font-size="13" font-weight="600" fill="#1f2328">✗ 本地两轮皆空</text><text x="366" y="401" font-size="11" fill="#656d76">→ 自动升级 L2（不硬答）</text><line x1="480" y1="408" x2="480" y2="432" stroke="#bf8700" stroke-width="1.6" marker-end="url(#ar)"/><rect x="46" y="420" width="588" height="40" rx="8" fill="#ddf4ff" stroke="#0969da"/><text x="58" y="440" font-size="13" font-weight="600" fill="#1f2328">开发类直通（脚本 / API / MCP / DCTL / 插件）</text><text x="58" y="457" font-size="11" fill="#656d76">跳过上面两轮，直接 Grep 官方开发文档蒸馏.md（121KB · 62类/410方法）</text><rect x="46" y="476" width="280" height="44" rx="8" fill="#dafbe1" stroke="#1a7f37"/><text x="58" y="496" font-size="13" font-weight="600" fill="#1f2328">✓ 命中 → 直接答</text><text x="58" y="513" font-size="11" fill="#656d76">标注 Studio 限制 + 版本 21.1</text><rect x="354" y="476" width="280" height="44" rx="8" fill="#ffebe9" stroke="#cf222e"/><text x="366" y="496" font-size="13" font-weight="600" fill="#1f2328">✗ 仍不确定</text><text x="366" y="513" font-size="11" fill="#656d76">→ 升级 L2</text><line x1="186" y1="520" x2="186" y2="544" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#ar)"/><rect x="46" y="544" width="588" height="40" rx="8" fill="#ffffff" stroke="#c9d1d9"/><text x="58" y="564" font-size="13" font-weight="600" fill="#1f2328">答后必问 · 是否打开手册浏览器（六个 tab）</text><text x="58" y="581" font-size="11" fill="#656d76">用户确认后才present_files 打开；确认前不弹</text><rect x="20" y="612" width="640" height="204" rx="10" fill="none" stroke="#bf8700" stroke-width="2"/><rect x="20" y="612" width="86" height="24" rx="6" fill="#bf8700"/><text x="63" y="629" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">L2 深读</text><text x="116" y="629" font-size="10.5" fill="#bf8700">自动升级 · 篇幅放宽 · 首次联网</text><rect x="46" y="650" width="588" height="62" rx="8" fill="#fff8c5" stroke="#bf8700"/><text x="58" y="670" font-size="13" font-weight="600" fill="#1f2328">触发：① L1 两轮未命中 ② 用户要深度 ③ 追问 ≥2 轮</text><text x="58" y="687" font-size="11" fill="#656d76">· 脱离速查入口：index_terms 定位页码 → 全文精读 ±50~100 行（中/英对照）</text><text x="58" y="702" font-size="11" fill="#656d76">· 联网搜索（官方社区 / YouTube / B站）与手册交叉验证，冲突以英文原版为准</text><line x1="340" y1="712" x2="340" y2="734" stroke="#bf8700" stroke-width="1.6" marker-end="url(#ar)"/><rect x="46" y="734" width="280" height="40" rx="8" fill="#dafbe1" stroke="#1a7f37"/><text x="58" y="754" font-size="13" font-weight="600" fill="#1f2328">✓ 比对一致 → 精确回答</text><text x="58" y="771" font-size="11" fill="#656d76">可标「第X章 P1234」</text><rect x="354" y="734" width="280" height="40" rx="8" fill="#ffebe9" stroke="#cf222e"/><text x="366" y="754" font-size="13" font-weight="600" fill="#1f2328">✗ 仍无法确定</text><text x="366" y="771" font-size="11" fill="#656d76">→ 进 L3</text><line x1="480" y1="774" x2="480" y2="796" stroke="#cf222e" stroke-width="1.6" marker-end="url(#ar)"/><rect x="20" y="796" width="640" height="180" rx="10" fill="none" stroke="#cf222e" stroke-width="2"/><rect x="20" y="796" width="86" height="24" rx="6" fill="#cf222e"/><text x="63" y="813" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">L3 兜底</text><text x="116" y="813" font-size="10.5" fill="#cf222e">手册未覆盖 · 不编造</text><rect x="46" y="834" width="588" height="62" rx="8" fill="#ffebe9" stroke="#cf222e"/><text x="58" y="854" font-size="13" font-weight="600" fill="#1f2328">明说「手册未覆盖」+ 标注「这是外部说法、非手册内容」</text><text x="58" y="871" font-size="11" fill="#656d76">· 给外部来源链接（官方社区 / YouTube / B站）</text><text x="58" y="886" font-size="11" fill="#656d76">· 给可执行的排查/试错步骤，而不是含糊结论</text><line x1="340" y1="896" x2="340" y2="918" stroke="#cf222e" stroke-width="1.6" marker-end="url(#ar)"/><rect x="46" y="918" width="588" height="40" rx="8" fill="#dafbe1" stroke="#1a7f37"/><text x="58" y="938" font-size="13" font-weight="600" fill="#1f2328">转写进本地词典 → 下次同样问题走 L1 命中</text><text x="58" y="955" font-size="11" fill="#656d76">把这次联网查到的高频问法补进 小白现象词典/口语问句映射，命中率持续上升</text><rect x="20" y="990" width="640" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="32" y="1010" font-size="11.5" font-weight="600" fill="#1f2328">为什么 L1 坚决不联网</text><text x="32" y="1028" font-size="11" fill="#656d76">本地 Grep 约 250~310ms、返回 KB 级；联网 3~15 秒、返回几十 KB 且可能不通（本机 git push / PyPI 均被代理拦）。</text><text x="32" y="1046" font-size="11" fill="#656d76">联网是「查不到时的兜底」，不是加速手段 —— 80% 的问题本地已覆盖。</text><text x="20" y="1100" font-size="11.5" font-weight="600" fill="#1f2328">检索路由（按问题类型）</text><text x="34" y="1118" font-size="10.5" fill="#0969da">▸ 快捷键</text><text x="196" y="1118" font-size="10.5" fill="#656d76">shortcuts.md（818条）</text><text x="34" y="1132" font-size="10.5" fill="#0969da">▸ 怎么XXX / 某功能在哪</text><text x="196" y="1132" font-size="10.5" fill="#656d76">高频速查.md → index_terms.txt 拿页码</text><text x="34" y="1146" font-size="10.5" fill="#0969da">▸ 插件中文名 / 是否 Studio</text><text x="196" y="1146" font-size="10.5" fill="#656d76">Resolve_FX + Fairlight 对照</text><text x="34" y="1160" font-size="10.5" fill="#0969da">▸ 实战技巧（色彩/混音/Fusion）</text><text x="196" y="1160" font-size="10.5" fill="#656d76">实战术语对照 → 油管笔记对应小节</text><text x="34" y="1174" font-size="10.5" fill="#0969da">▸ 有没有免费插件 / 怎么装</text><text x="196" y="1174" font-size="10.5" fill="#656d76">开源插件清单.md（169项）</text><text x="34" y="1188" font-size="10.5" fill="#0969da">▸ 开发 /脚本 / API / MCP</text><text x="196" y="1188" font-size="10.5" fill="#656d76">官方开发文档蒸馏.md（直达，不联网）</text></svg>