<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" role="img"><title>达芬奇21中文操作手册 · 运行逻辑速览（L1→L2→L3 三态递进）</title><desc>首次调用速览：提问先过三层问句归一化词典，再走三态递进——L1 极速本地检索（默认、离线、约300ms）、L2 深读（自动升级、联网双重比对）、L3 兜底（明说手册未覆盖）。答后把新问法回流本地词典，下次走 L1 命中。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/></marker></defs><rect x="0" y="0" width="680" height="700" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="340" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">运行逻辑速览 · 三态递进</text><text x="340" y="44" font-size="10.5" text-anchor="middle" fill="#656d76">本地查得到就用本地，查不到才联网 · 首次调用约 300ms</text><rect x="215" y="58" width="250" height="34" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="227" y="77" font-size="13" font-weight="600" fill="#1f2328">你问了一个达芬奇问题</text><line x1="340" y1="92" x2="340" y2="110" stroke="#d0d7de" stroke-width="1.6" marker-end="url(#ar)"/><rect x="150" y="110" width="380" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="162" y="129" font-size="13" font-weight="600" fill="#1f2328">第 0 步 · 问句归一化（必做）</text><text x="162" y="145" font-size="10.5" fill="#656d76">三层词典把大白话翻译成术语：① 小白现象 ② 口语问句 ③ 中英对照</text><text x="162" y="159" font-size="10.5" fill="#656d76">例：「人声太吵」→ 降噪 / 语音隔离</text><line x1="340" y1="162" x2="340" y2="180" stroke="#d0d7de" stroke-width="1.6" marker-end="url(#ar)"/><text x="352" y="176" font-size="10" fill="#cf222e">听不懂描述 → 先反问你，不硬答</text><rect x="20" y="180" width="640" height="132" rx="10" fill="none" stroke="#0969da" stroke-width="2"/><rect x="20" y="180" width="80" height="23" rx="6" fill="#0969da" stroke="#0969da" stroke-width="1"/><text x="60.0" y="196" font-size="11.5" font-weight="700" text-anchor="middle" fill="#fff">L1 极速</text><text x="112" y="196" font-size="10" fill="#0969da">默认 · 全程离线 · 约 300ms · 禁止联网</text><rect x="46" y="214" width="300" height="46" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/><text x="58" y="233" font-size="12.5" font-weight="600" fill="#1f2328">第 1 轮 · 小资产 Grep</text><text x="58" y="249" font-size="10.5" fill="#656d76">速查表 / 快捷键 / 插件对照 / 术语表</text><text x="58" y="263" font-size="10.5" fill="#656d76">命中即答（300字内）</text><rect x="334" y="214" width="300" height="46" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/><text x="346" y="233" font-size="12.5" font-weight="600" fill="#1f2328">第 2 轮 · 倒排索引拿页码</text><text x="346" y="249" font-size="10.5" fill="#656d76">36711 词索引 → 精读手册局部</text><text x="346" y="263" font-size="10.5" fill="#656d76">开发类直通开发文档</text><line x1="346" y1="260" x2="346" y2="278" stroke="#bf8700" stroke-width="1.6" marker-end="url(#ar)"/><rect x="46" y="278" width="588" height="26" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="58" y="297" font-size="12" font-weight="600" fill="#1f2328">✓ 命中 → 直接给答案（结论 + 步骤 + 快捷键 Mac/Win）</text><line x1="494" y1="304" x2="494" y2="330" stroke="#bf8700" stroke-width="1.6" marker-end="url(#ar)"/><text x="502" y="322" font-size="10" fill="#bf8700">本地两轮皆空 · 或追问 ≥2 轮</text><rect x="20" y="330" width="640" height="112" rx="10" fill="none" stroke="#bf8700" stroke-width="2"/><rect x="20" y="330" width="80" height="23" rx="6" fill="#bf8700" stroke="#bf8700" stroke-width="1"/><text x="60.0" y="346" font-size="11.5" font-weight="700" text-anchor="middle" fill="#fff">L2 深读</text><text x="112" y="346" font-size="10" fill="#bf8700">自动升级 · 首次联网 · 篇幅放宽</text><rect x="46" y="364" width="588" height="44" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1"/><text x="58" y="383" font-size="12.5" font-weight="600" fill="#1f2328">全文精读 ±50~100 行（中/英对照） + 联网搜索双重比对</text><text x="58" y="399" font-size="10.5" fill="#656d76">冲突时以 Blackmagic 英文原版 + 官方来源为准</text><line x1="494" y1="408" x2="494" y2="430" stroke="#cf222e" stroke-width="1.6" marker-end="url(#ar)"/><text x="502" y="425" font-size="10" fill="#cf222e">联网后仍无法确定</text><rect x="46" y="430" width="588" height="26" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="58" y="449" font-size="12" font-weight="600" fill="#1f2328">✓ 比对一致 → 精确回答（可标「第 X 章 P1234」）</text><rect x="20" y="468" width="640" height="92" rx="10" fill="none" stroke="#cf222e" stroke-width="2"/><rect x="20" y="468" width="80" height="23" rx="6" fill="#cf222e" stroke="#cf222e" stroke-width="1"/><text x="60.0" y="484" font-size="11.5" font-weight="700" text-anchor="middle" fill="#fff">L3 兜底</text><text x="112" y="484" font-size="10" fill="#cf222e">手册未覆盖 · 不编造</text><rect x="46" y="502" width="588" height="46" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="58" y="521" font-size="12.5" font-weight="600" fill="#1f2328">明说「手册未覆盖」+ 标注「外部说法、非手册内容」</text><text x="58" y="537" font-size="10.5" fill="#656d76">给外部来源链接 + 可执行的排查 / 试错步骤</text><line x1="340" y1="560" x2="340" y2="582" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#ar)"/><rect x="46" y="582" width="588" height="46" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="58" y="601" font-size="12.5" font-weight="600" fill="#1f2328">回写本地词典：这次的新问法补进三层词典</text><text x="58" y="617" font-size="10.5" fill="#656d76">下次同样问题在 L1 就命中 —— 命中率会持续上升</text><text x="20" y="656" font-size="11" font-weight="600" fill="#1f2328">检索路由（按问题类型）</text><text x="26" y="672" font-size="10" fill="#0969da">▸ 快捷键</text><text x="200" y="672" font-size="10" fill="#656d76">shortcuts.md</text><text x="26" y="686" font-size="10" fill="#0969da">▸ 怎么XXX / 功能在哪</text><text x="200" y="686" font-size="10" fill="#656d76">高频速查 → index_terms 拿页码</text><text x="26" y="700" font-size="10" fill="#0969da">▸ 实战技巧（色彩/混音/Fusion）</text><text x="200" y="700" font-size="10" fill="#656d76">术语对照 → 油管笔记小节</text><text x="26" y="714" font-size="10" fill="#0969da">▸ 免费插件 / 怎么装</text><text x="200" y="714" font-size="10" fill="#656d76">开源插件清单 169 项</text></svg>