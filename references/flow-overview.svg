<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780" width="680" height="780" role="img"><title>达芬奇21中文操作手册 · 运行逻辑速览（首次判定 + 双触发源三态递进）</title><desc>每次激活先判是否首次：读状态文件，firstRunShown=true 则跳过引导直接问答（零开销）。提问后先过三层问句归一化词典，再走三态递进：L1 极速本地检索（默认、离线）、L2 深读（本地答不上来或用户明确要深入）、L3 兜底（明说手册未覆盖）。答后把新问法回写词典与主题记录，下次走 L1 命中。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/></marker></defs><rect x="0" y="0" width="680" height="780" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="340" y="24" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1f2328">运行逻辑速览 · 首次判定 + 三态递进</text><text x="340" y="41" font-size="10" text-anchor="middle" fill="#656d76">本地查得到就用本地，查不到才联网 · 首次调用约 300ms</text><rect x="20" y="54" width="640" height="74" rx="10" fill="#f6f8fa" stroke="#c9d1d9" stroke-width="1.5"/><text x="32" y="70" font-size="11.5" font-weight="700" fill="#1f2328">阶段 0 · 首次使用判定（跨会话只做一次）</text><rect x="32" y="78" width="300" height="40" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/><text x="43" y="96" font-size="11" font-weight="600" fill="#1f2328">读状态文件</text><text x="43" y="111" font-size="9.5" fill="#656d76">check-first-run.js → isFirstRun</text><rect x="348" y="78" width="300" height="40" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="359" y="96" font-size="11" font-weight="600" fill="#1f2328">false → 直接问答</text><text x="359" y="111" font-size="9.5" fill="#656d76">不弹图· 不读 SVG（零开销）</text><line x1="336" y1="98" x2="346" y2="98" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ar)"/><line x1="182" y1="118" x2="182" y2="132" stroke="#bf8700" stroke-width="1.5" marker-end="url(#ar)"/><text x="190" y="129" font-size="9.5" fill="#bf8700">true → 首次：展示速览图 → --mark 落盘（此后不再弹）</text><rect x="140" y="132" width="400" height="44" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="151" y="150" font-size="12" font-weight="600" fill="#1f2328">第 1 步 · 问句归一化（必做）</text><text x="151" y="165" font-size="9.5" fill="#656d76">三层词典：① 小白现象 ② 口语问句 ③ 中英/章节映射</text><line x1="340" y1="176" x2="340" y2="192" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#ar)"/><text x="350" y="188" font-size="9.5" fill="#cf222e">「需澄清」→ 先反问，不硬答不联网</text><rect x="20" y="192" width="640" height="118" rx="10" fill="none" stroke="#0969da" stroke-width="2"/><rect x="20" y="192" width="76" height="22" rx="6" fill="#0969da" stroke="#0969da" stroke-width="1"/><text x="58.0" y="207" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">L1 极速</text><text x="107" y="207" font-size="9.5" fill="#0969da">默认 · 全程离线 · 约 300ms</text><rect x="40" y="222" width="290" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/><text x="51" y="240" font-size="11" font-weight="600" fill="#1f2328">第 1 轮 · 小资产 Grep</text><text x="51" y="255" font-size="9.5" fill="#656d76">速查/ 快捷键 / 插件对照 / 术语表</text><rect x="350" y="222" width="290" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/><text x="361" y="240" font-size="11" font-weight="600" fill="#1f2328">第 2 轮 · 倒排索引拿页码</text><text x="361" y="255" font-size="9.5" fill="#656d76">36711 词 → 精读手册局部</text><rect x="40" y="276" width="600" height="24" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="51" y="294" font-size="11" font-weight="600" fill="#1f2328">✓ 能给出完整步骤 → 直接答（≤300 字，Mac/Win 双写）</text><line x1="340" y1="310" x2="340" y2="336" stroke="#bf8700" stroke-width="1.5" marker-end="url(#ar)"/><rect x="20" y="336" width="640" height="76" rx="10" fill="none" stroke="#8250df" stroke-width="2"/><rect x="20" y="336" width="108" height="22" rx="6" fill="#8250df" stroke="#8250df" stroke-width="1"/><text x="74.0" y="351" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">升级判定</text><text x="139" y="351" font-size="9.5" fill="#8250df">双触发源 · 命中任一即升 L2（与「是不是追问」无关）</text><rect x="40" y="366" width="292" height="36" rx="8" fill="#f3e8ff" stroke="#8250df" stroke-width="1"/><text x="51" y="384" font-size="11" font-weight="600" fill="#1f2328">A 本地答不上来</text><text x="51" y="399" font-size="9.5" fill="#656d76">两轮未命中 / 只给参数给不出原理</text><rect x="348" y="366" width="292" height="36" rx="8" fill="#f3e8ff" stroke="#8250df" stroke-width="1"/><text x="359" y="384" font-size="11" font-weight="600" fill="#1f2328">B 用户明确要深入</text><text x="359" y="399" font-size="9.5" fill="#656d76">详细讲讲/ 为什么 / 对比一下</text><line x1="600" y1="412" x2="600" y2="428" stroke="#bf8700" stroke-width="1.5" marker-end="url(#ar)"/><rect x="20" y="428" width="640" height="88" rx="10" fill="none" stroke="#bf8700" stroke-width="2"/><rect x="20" y="428" width="76" height="22" rx="6" fill="#bf8700" stroke="#bf8700" stroke-width="1"/><text x="58.0" y="443" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">L2 深读</text><text x="107" y="443" font-size="9.5" fill="#bf8700">自动升级 · 首次联网 · 篇幅放宽</text><rect x="40" y="458" width="600" height="46" rx="8" fill="#fff8c5" stroke="#bf8700" stroke-width="1"/><text x="51" y="476" font-size="11.5" font-weight="600" fill="#1f2328">全文精读 ±50~100 行（中/英对照） + 联网搜索双重比对</text><text x="51" y="491" font-size="9.5" fill="#656d76">冲突时以 Blackmagic 英文原版 + 官方来源为准</text><line x1="340" y1="504" x2="340" y2="520" stroke="#cf222e" stroke-width="1.5" marker-end="url(#ar)"/><rect x="20" y="520" width="640" height="66" rx="10" fill="none" stroke="#cf222e" stroke-width="2"/><rect x="20" y="520" width="76" height="22" rx="6" fill="#cf222e" stroke="#cf222e" stroke-width="1"/><text x="58.0" y="535" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">L3 兜底</text><text x="107" y="535" font-size="9.5" fill="#cf222e">手册未覆盖 · 不编造</text><rect x="40" y="548" width="600" height="28" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="51" y="566" font-size="11" font-weight="600" fill="#1f2328">明说「手册未覆盖」+ 标注「外部说法」+ 给可执行试错步骤</text><line x1="340" y1="586" x2="340" y2="604" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ar)"/><rect x="40" y="604" width="600" height="44" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="51" y="622" font-size="11.5" font-weight="600" fill="#1f2328">答后回写：把新问法补进三层词典 + 记录本轮主题（--topic）</text><text x="51" y="637" font-size="9.5" fill="#656d76">下次同样问题在 L1 就命中 —— 命中率持续上升</text><text x="20" y="670" font-size="11" font-weight="600" fill="#1f2328">检索路由（按问题类型）</text><text x="24" y="687" font-size="9.5" fill="#0969da">▸ 快捷键</text><text x="196" y="687" font-size="9.5" fill="#656d76">shortcuts.md</text><text x="24" y="702" font-size="9.5" fill="#0969da">▸ 怎么XXX / 功能在哪</text><text x="196" y="702" font-size="9.5" fill="#656d76">高频速查 → index_terms 拿页码</text><text x="24" y="717" font-size="9.5" fill="#0969da">▸ 实战技巧（色彩/混音/Fusion）</text><text x="196" y="717" font-size="9.5" fill="#656d76">术语对照 → 油管笔记小节</text><text x="24" y="732" font-size="9.5" fill="#0969da">▸ 免费插件 / 怎么装</text><text x="196" y="732" font-size="9.5" fill="#656d76">开源插件清单 169 项</text><text x="24" y="747" font-size="9.5" fill="#0969da">▸ 开发 / 脚本 / API / MCP</text><text x="196" y="747" font-size="9.5" fill="#656d76">开发文档蒸馏（直达，不联网）</text></svg>