<line x1="630" y1="320" x2="638" y2="320"/>
<line x1="630" y1="368" x2="638" y2="368"/>
<line x1="350" y1="444" x2="350" y2="480"/>
<line x1="340" y1="536" x2="340" y2="566"/>
