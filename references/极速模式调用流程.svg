<line x1="340" y1="634" x2="340" y2="662"/>
<line x1="340" y1="766" x2="340" y2="786"/>
<line x1="220" y1="815" x2="243" y2="815"/>
<line x1="435" y1="815" x2="458" y2="815"/>
</g>
<g>
<rect x="230" y="20" width="220" height="56" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">用户提达芬奇问题</text>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">→ 加载本 skill（优先检索）</text>
</g>
<g>
<polygon points="340,84 435,120 340,156 245,120" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="340" y="114" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">开发类？</text>
<text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#854F0B">(脚本/API/MCP)</text>
</g>
<g>
<rect x="470" y="100" width="160" height="44" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="550" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#27500A">官方开发文档 tab</text>
<text x="550" y="134" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#3B6D11">(开发类优先调用)</text>
</g>
<g>
<rect x="230" y="188" width="220" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="340" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Grep 结构化数据</text>
<text x="340" y="226" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">(快捷键/高频速查/插件对照)</text>
</g>
<g>
<polygon points="340,266 420,300 340,334 260,300" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="340" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">关键词命中？</text>
</g>
<g>
<rect x="470" y="252" width="160" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="550" y="272" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">快捷键 tab</text>
</g>
<g>
<rect x="470" y="300" width="160" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="550" y="320" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#0C447C">高频速查 tab（普通操作）</text>
</g>
<g>
<rect x="470" y="348" width="160" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="550" y="368" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">插件中英对照 tab</text>
</g>
<g>
<rect x="250" y="396" width="200" height="48" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
<text x="350" y="414" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#72243E">全文检索 tab</text>
<text x="350" y="430" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#993556">(可切中·英，未命中降级)</text>
</g>
<g>
<rect x="240" y="480" width="200" height="56" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="340" y="500" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#27500A">组答案</text>
<text x="340" y="518" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#3B6D11">(结论+1/2/3步骤+快捷键)</text>
</g>
<g>
<polygon points="340,566 420,600 340,634 260,600" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="340" y="600" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">打开浏览器？</text>
</g>
<g>
<rect x="470" y="580" width="160" height="44" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="550" y="598" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">打开 HTML</text>
<text x="550" y="614" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#534AB7">(五 tab，用户确认后)</text>
</g>
<g font-family="sans-serif" font-size="11" fill="#64748b">
<text x="448" y="108" text-anchor="middle">是·开发类</text>
<text x="318" y="176" text-anchor="middle">否</text>
<text x="430" y="288" text-anchor="middle">命中</text>
<text x="312" y="372" text-anchor="middle">未命中</text>
<text x="448" y="588" text-anchor="middle">确认</text>
<text x="322" y="676" text-anchor="middle">否 → 结束</text>
</g>
<!-- 分隔线 + 非极速标题 -->
<line x1="40" y1="700" x2="640" y2="700" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="340" y="692" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">非极速模式（深度解读 · 触发式 · 非默认）</text>
<text x="340" y="716" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">仅当用户明确要深度对话 / 多次追问（≥2 轮）时触发</text>
<!-- 非极速触发节点 -->
<rect x="240" y="726" width="200" height="40" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
<text x="340" y="746" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#72243E">触发：深度对话 / 多次追问</text>
<!-- 非极速三栏 -->
<rect x="30" y="786" width="190" height="58" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
<text x="125" y="806" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#72243E">全文检索 tab</text>
<text x="125" y="824" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#993556">深度精读 ±50~100 行</text>
<text x="125" y="839" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#993556">（可切中·英）</text>
<rect x="245" y="786" width="190" height="58" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
<text x="340" y="806" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#72243E">联网搜索</text>
<text x="340" y="824" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#993556">+ 双重比对</text>
<text x="340" y="839" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#993556">手册×网络交叉验证</text>
<rect x="460" y="786" width="190" height="58" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="555" y="806" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#27500A">最精确回答</text>
<text x="555" y="824" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#3B6D11">讲透原理/边界</text>
<text x="555" y="839" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#3B6D11">/多方案</text>
</svg>
