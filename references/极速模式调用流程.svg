<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 850" width="680" height="850" role="img">
<title>达芬奇21中文操作手册 调用流程（极速默认 + 非极速触发）</title>
<desc>极速模式为默认：开发类优先官方开发文档 tab；非开发先查结构化数据（快捷键/高频速查=普通操作/插件对照），命中即答，未命中降级全文检索。非极速模式为触发式：仅当用户明确深度对话或多次追问时，改走全文检索深度精读 + 联网搜索双重比对，给最精确解读。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
