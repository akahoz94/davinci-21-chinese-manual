<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 950" width="680" height="950" role="img">
<title>达芬奇21中文操作手册 双模式调用流程（v2.0 · 极速默认 + 非极速触发）</title>
<desc>极速模式为默认：开发类优先官方开发文档 tab；非开发先查结构化数据（快捷键 / 高频速查=普通操作 / 插件对照），命中即答；未命中先查 index.json 倒排索引定位页码与章节，再按页码精读全文检索 tab 局部。非极速模式为触发式：仅当用户明确深度对话或多次追问时，改走全文检索深度精读 + 联网搜索双重比对。</desc>
